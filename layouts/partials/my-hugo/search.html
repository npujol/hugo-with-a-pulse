{{- if site.Params.search.enable -}}
{{- $indexURL := "" -}}
{{- with site.Home }}{{ with .OutputFormats.Get "json" }}{{ $indexURL = .Permalink }}{{ end }}{{ end }}
<form class="search-form" id="search-form" role="search" aria-label="{{ i18n "search" }}"
  data-index-url="{{ $indexURL }}"
  data-max-results="{{ site.Params.search.maxResults | default 8 }}"
  action="{{ site.Home.RelPermalink }}" method="get">
  <input class="search-input" id="search-input" type="search" name="q"
    placeholder="{{ i18n "searchPlaceholder" }}" autocomplete="off" spellcheck="false"
    aria-label="{{ i18n "search" }}" aria-controls="search-results" aria-expanded="false"
    role="combobox" aria-haspopup="listbox" aria-autocomplete="list">
  <button class="search-submit" type="submit" aria-label="{{ i18n "search" }}">🔍</button>
  <ul class="search-results" id="search-results" role="listbox" aria-label="{{ i18n "searchResults" }}" hidden></ul>
</form>
{{- end -}}
